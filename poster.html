<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SeeLayer Marketing Poster</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Space+Grotesk:wght@700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- html2canvas for exporting -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

    <style>
        body {
            background-color: #020617;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            font-family: 'Inter', sans-serif;
            padding: 40px;
        }

        /* Controls outside the poster */
        .controls {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 100;
        }

        .download-btn {
            background: #3b82f6;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.4);
            transition: all 0.2s;
        }

        .download-btn:hover {
            background: #2563eb;
            transform: translateY(-2px);
        }

        /* 9:16 Aspect Ratio Poster (1080x1920) */
        .poster-container {
            width: 1080px;
            height: 1920px;
            background: linear-gradient(145deg, #020617 0%, #0f172a 50%, #020617 100%);
            position: relative;
            overflow: hidden;
            /* Scale down for viewing on screen, but html2canvas exports original 1080x1920 */
            transform: scale(0.4);
            transform-origin: top center;
            margin-bottom: -1150px;
            /* offset the scale */
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            border: 1px solid #1e293b;
        }

        /* Decorative Background Elements */
        .glow-orb-1 {
            position: absolute;
            top: -200px;
            left: -200px;
            width: 800px;
            height: 800px;
            background: radial-gradient(circle, rgba(59, 130, 246, 0.15) 0%, rgba(0, 0, 0, 0) 70%);
            border-radius: 50%;
            z-index: 1;
        }

        .glow-orb-2 {
            position: absolute;
            bottom: -300px;
            right: -300px;
            width: 1000px;
            height: 1000px;
            background: radial-gradient(circle, rgba(16, 185, 129, 0.1) 0%, rgba(0, 0, 0, 0) 70%);
            border-radius: 50%;
            z-index: 1;
        }

        .grid-overlay {
            position: absolute;
            inset: 0;
            background-image: linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
            background-size: 60px 60px;
            z-index: 2;
        }

        /* Poster Content */
        .poster-content {
            position: relative;
            z-index: 10;
            height: 100%;
            display: flex;
            flex-direction: column;
            padding: 120px 100px;
            box-sizing: border-box;
        }

        /* Header */
        .header {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            margin-bottom: 120px;
        }

        .header img {
            width: 180px;
            height: auto;
            margin-bottom: 40px;
        }

        .header h1 {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 85px;
            color: white;
            margin: 0;
            letter-spacing: -2px;
        }

        .header h2 {
            color: #60a5fa;
            font-size: 32px;
            font-weight: 600;
            margin-top: 20px;
            text-transform: uppercase;
            letter-spacing: 4px;
        }

        /* Services List */
        .services-wrapper {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 45px;
        }

        .service-item {
            display: flex;
            align-items: center;
            background: rgba(30, 41, 59, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.05);
            padding: 45px 50px;
            border-radius: 24px;
            backdrop-filter: blur(10px);
            border-left: 6px solid #3b82f6;
        }

        .service-item:nth-child(even) {
            border-left-color: #10b981;
        }

        .service-icon {
            font-size: 50px;
            color: #60a5fa;
            margin-right: 40px;
            width: 60px;
            text-align: center;
        }

        .service-item:nth-child(even) .service-icon {
            color: #34d399;
        }

        .service-text {
            color: white;
            font-size: 42px;
            font-weight: 600;
        }

        /* Footer */
        .footer {
            margin-top: auto;
            background: rgba(15, 23, 42, 0.8);
            border-radius: 24px;
            padding: 60px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            text-align: center;
        }

        .footer-name {
            color: white;
            font-size: 48px;
            font-family: 'Space Grotesk', sans-serif;
            margin: 0 0 10px 0;
        }

        .footer-title {
            color: #94a3b8;
            font-size: 28px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin: 0 0 40px 0;
        }

        .footer-contact {
            display: inline-block;
            background: rgba(59, 130, 246, 0.15);
            padding: 20px 40px;
            border-radius: 100px;
            color: #60a5fa;
            font-size: 32px;
            font-weight: 600;
            border: 1px solid rgba(59, 130, 246, 0.3);
        }
    </style>
</head>

<body>

    <div class="controls">
        <button class="download-btn" onclick="downloadPoster()"><i class="fa-solid fa-download"></i> Download Poster
            (PNG)</button>
    </div>

    <!-- The Poster Design -->
    <div class="poster-container" id="poster">
        <div class="glow-orb-1"></div>
        <div class="glow-orb-2"></div>
        <div class="grid-overlay"></div>

        <div class="poster-content">

            <div class="header">
                <img src="logo.png" alt="SecureLayer Logo" crossorigin="anonymous">
                <h1>SecureLayer</h1>
                <h2>Elite Offensive Security</h2>
            </div>

            <div class="services-wrapper">
                <div class="service-item">
                    <div class="service-icon"><i class="fa-solid fa-shield-halved"></i></div>
                    <div class="service-text">Pentest as a Service (PTaaS)</div>
                </div>

                <div class="service-item">
                    <div class="service-icon"><i class="fa-solid fa-box-check"></i></div>
                    <div class="service-text">Product Security as a Service</div>
                </div>

                <div class="service-item">
                    <div class="service-icon"><i class="fa-solid fa-brain"></i></div>
                    <div class="service-text">AI & Logic Security</div>
                </div>

                <div class="service-item">
                    <div class="service-icon"><i class="fa-solid fa-mobile-screen"></i></div>
                    <div class="service-text">Mobile Application Testing</div>
                </div>

                <div class="service-item">
                    <div class="service-icon"><i class="fa-solid fa-cloud"></i></div>
                    <div class="service-text">Cloud Security Review</div>
                </div>

                <div class="service-item">
                    <div class="service-icon"><i class="fa-solid fa-skull-crossbones"></i></div>
                    <div class="service-text">Red Team Operations</div>
                </div>
            </div>

            <div class="footer">
                <h3 class="footer-name">Ninad Gowda</h3>
                <p class="footer-title">CEO and Founder</p>
                <div class="footer-contact">
                    <i class="fa-solid fa-envelope" style="margin-right: 12px;"></i> contact@securelayer.in
                </div>
            </div>

        </div>
    </div>

    <script>
        function downloadPoster() {
            const btn = document.querySelector('.download-btn');
            btn.innerText = "Generating PNG...";

            // html2canvas renders the div exactly as styled into a PNG data URL
            html2canvas(document.getElementById('poster'), {
                scale: 1, // Capture at exactly 1080x1920
                useCORS: true, // Allow loading local logo.png
                backgroundColor: '#020617'
            }).then(canvas => {
                const link = document.createElement('a');
                link.download = 'SecureLayer_Marketing_Poster.png';
                link.href = canvas.toDataURL('image/png');
                link.click();
                btn.innerHTML = '<i class="fa-solid fa-check"></i> Downloaded!';
                setTimeout(() => {
                    btn.innerHTML = '<i class="fa-solid fa-download"></i> Download Poster (PNG)';
                }, 3000);
            });
        }
    </script>
</body>

</html>
